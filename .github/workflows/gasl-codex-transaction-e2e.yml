name: GASL — Real Codex inert Skill install discover rollback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gasl-codex-transaction-e2e.yml
      - tools/codex_transaction_e2e.py
      - tools/codex_pinned_bundle_e2e.py
      - tools/codex_project_install.py
      - tools/codex_uninstalled_restore.py
      - tools/codex_legacy_reconcile.py
      - tools/host_format_review.py
      - tests/test_codex_pinned_bundle_e2e.py
      - tests/test_codex_project_install.py
      - tests/test_codex_uninstalled_restore.py
      - tests/test_codex_legacy_reconcile.py
      - tools/gasl.py
      - tools/host_adapters.py
      - tests/test_codex_transaction_e2e.py
      - tools/fixture_transaction_v2.py
      - tools/fixture_explicit_consent.py
      - tests/test_fixture_explicit_consent.py
      - tools/codex_discovery_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-codex-fixture-lifecycle:
    name: Real Codex app-server sees test-only Skill, then verifies rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up disposable Node environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify negative and positive fixture tests using fake subprocess Host
        run: python3 -m unittest tests.test_codex_transaction_e2e -v

      - name: Check pinned full-bundle negative and success paths (synthetic Host)
        run: python3 -m unittest tests.test_codex_pinned_bundle_e2e -v

      - name: Test one-time expiring fixture receipts with synthetic packages and fake consent
        run: python3 -m unittest tests.test_fixture_explicit_consent -v

      - name: Install exact vendor Codex CLI release only in runner temporary folder
        env:
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/gasl-codex-e2e" \
            --ignore-scripts --no-audit --no-fund --no-save --package-lock=false \
            '@openai/codex@0.162.1'
          cli="$RUNNER_TEMP/gasl-codex-e2e/node_modules/@openai/codex/bin/codex.js"
          test -f "$cli" && test -x "$cli"
          echo "GASL_CODEX_E2E_CLI=$cli" >> "$GITHUB_ENV"

      - name: End-to-end pinned full ZIP with actual Codex, inert test source only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from tests.test_install_bundle import PrivateInstallBundleTests
          from codex_pinned_bundle_e2e import ACKNOWLEDGEMENT, verify_pinned_bundle_lifecycle
          from queue_ingest import git_blob
          fixture = PrivateInstallBundleTests(
              'test_private_zip_contains_only_pinned_files_and_is_verified')
          fixture.setUp()
          try:
              source = (b'---\nname: demo\ndescription: Inert GASL full ZIP live Host test\n'
                        b'---\n# Test only\nNo executable scripts or external dependencies.\n')
              fixture.content['skills/demo/SKILL.md'] = source
              fixture.row['skill_md_blob_sha'] = git_blob(source)
              fixture._package()
              package = fixture._prepare(agent='codex', scope='user')
              result = verify_pinned_bundle_lifecycle(
                  Path(os.environ['GASL_CODEX_E2E_CLI']), package['plan_id'],
                  ACKNOWLEDGEMENT, bundle_root=fixture.root, lookup=fixture.lookup)
              assert result['status'] == 'real_codex_pinned_full_bundle_discovery_and_rollback_verified', result
              for key in ('pinned_package_and_format_checked', 'target_preflight_state_bound',
                          'absent_before_install', 'full_pinned_zip_temporarily_staged_and_activated',
                          'exact_skill_discovered_and_enabled', 'fixture_rollback_verified',
                          'absent_after_rollback', 'temporary_profile_deleted'):
                  assert result[key] is True, key
              assert result['file_count'] == 2
              for key in ('real_user_authorization_collected', 'real_home_or_codex_profile_accessed',
                          'real_host_files_modified', 'third_party_skill_executed',
                          'skill_commands_or_dependencies_executed', 'model_turn_started',
                          'authentication_performed', 'production_installation_enabled'):
                  assert result[key] is False, key
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write('\n## Pinned complete ZIP + Codex lifecycle — PASS\n\n')
                  f.write('An inert, GASL-authored two-file pinned ZIP passed actual Codex discovery and locked fixture rollback in an empty temporary user HOME. No third-party package was executed or installed in a real account.\n')
              print('PINNED_FULL_ZIP_CODEX_REAL_HOST_CI=PASS; THIRD_PARTY_EXECUTED=FALSE')
          finally:
              fixture.doCleanups()
          PY

      - name: Exercise real Codex project restore plus attested legacy backup recovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,sys,tempfile
          from pathlib import Path
          from unittest.mock import patch
          sys.path.insert(0, 'tools')
          from tests.test_install_bundle import PrivateInstallBundleTests
          from queue_ingest import git_blob
          import codex_project_install as installer
          import codex_uninstalled_restore as archived_tools
          from codex_uninstalled_restore import (
              list_uninstalled_backups, preview_reinstall, reinstall_backup, _reinstall_phrase)
          from codex_legacy_reconcile import (
              audit_legacy_backups, preview_legacy_reinstall, reinstall_legacy_backup,
              _phrase as legacy_reinstall_phrase)
          from fixture_bundle_install import _inventory, _remove_verified_dir
          from codex_project_install import (
              preview_install, install_fresh, preview_replace, replace_existing,
              preview_restore, restore_backup, uninstall, recover,
              _install_phrase, _replace_phrase, _restore_phrase, _remove_phrase,
              _backup_dir, _backup_manifest)
          from codex_third_party_discovery import _query_codex
          fixture=PrivateInstallBundleTests(
              'test_private_zip_contains_only_pinned_files_and_is_verified')
          fixture.setUp()
          try:
              v1=(b'---\nname: demo\ndescription: Inert Phase 41 replacement v1\n'
                  b'---\n# GASL version one\nNo executable commands.\n')
              fixture.content['skills/demo/SKILL.md']=v1
              fixture.row['skill_md_blob_sha']=git_blob(v1)
              fixture.row['commit_sha']=hashlib.sha1(b'phase41-commit-v1').hexdigest()
              fixture.row['tree_sha']=hashlib.sha1(b'phase41-tree-v1').hexdigest()
              fixture._package()
              bundle1=fixture._prepare(agent='codex',scope='project')
              with tempfile.TemporaryDirectory(prefix='gasl-phase41-ci-') as location:
                  isolated=Path(location)
                  project=isolated/'project'
                  project.mkdir()
                  (project/'.git').mkdir()
                  for folder in ('home','codex-home','cache','xdg-config','tmp'):
                      (isolated/folder).mkdir()
                  binary=Path(os.environ['GASL_CODEX_E2E_CLI'])
                  target=project/'.agents/skills/demo'
                  expected=target/'SKILL.md'
                  target.mkdir(parents=True)
                  old=(b'---\nname: demo\ndescription: Existing inert Skill\n'
                       b'---\n# Previous user Skill\n')
                  (target/'SKILL.md').write_bytes(old)
                  (target/'user-note.txt').write_text('preserve in backup\n')
                  def discover():
                      return _query_codex(binary,isolated,project,'demo',expected)
                  before=discover()
                  assert len(before)==1 and before[0]['enabled'] is True, before
                  plan=preview_replace(bundle1['plan_id'],project,
                      bundle_root=fixture.root,lookup=fixture.lookup)
                  phrase=_replace_phrase('demo',bundle1['plan_id'],plan['state_binding_id'])
                  first=replace_existing(bundle1['plan_id'],project,plan['state_binding_id'],
                      bundle_root=fixture.root,lookup=fixture.lookup,reader=lambda _:phrase)
                  assert first['status']=='codex_project_skill_replaced'
                  assert expected.read_bytes()==v1
                  observed=discover()
                  assert len(observed)==1 and observed[0]['enabled'] is True, observed
                  backup=_backup_dir(project/'.gasl-managed','demo',first['backup_id'])
                  assert (backup/'user-note.txt').read_text()=='preserve in backup\n'
                  assert (backup/'SKILL.md').read_bytes()==old

                  v2=(b'---\nname: demo\ndescription: Inert Phase 41 replacement v2\n'
                      b'---\n# GASL version two\nNo executable commands.\n')
                  fixture.content['skills/demo/SKILL.md']=v2
                  fixture.row['skill_md_blob_sha']=git_blob(v2)
                  fixture.row['commit_sha']=hashlib.sha1(b'phase41-commit-v2').hexdigest()
                  fixture.row['tree_sha']=hashlib.sha1(b'phase41-tree-v2').hexdigest()
                  fixture._package()
                  bundle2=fixture._prepare(agent='codex',scope='project')
                  plan2=preview_replace(bundle2['plan_id'],project,
                      bundle_root=fixture.root,lookup=fixture.lookup)
                  phrase2=_replace_phrase('demo',bundle2['plan_id'],plan2['state_binding_id'])
                  original_new=installer._new
                  calls={'n':0}
                  def fail_after_backup_move(path,data):
                      calls['n']+=1
                      if calls['n']==2:
                          raise OSError('injected crash after previous Skill backup rename')
                      return original_new(path,data)
                  with patch.object(installer,'_new',side_effect=fail_after_backup_move):
                      try:
                          replace_existing(bundle2['plan_id'],project,plan2['state_binding_id'],
                              bundle_root=fixture.root,lookup=fixture.lookup,
                              reader=lambda _:phrase2)
                      except OSError as error:
                          assert 'injected crash' in str(error)
                      else:
                          raise AssertionError('Injected replacement interruption did not occur')
                  assert not target.exists()
                  assert not discover(), 'Codex should not discover a Skill during interrupted activation'
                  restored=recover('demo',project)
                  assert restored['status']=='interrupted_replacement_rolled_back',restored
                  assert expected.read_bytes()==v1
                  assert len(discover())==1, 'Codex must rediscover the restored old Skill'

                  plan2=preview_replace(bundle2['plan_id'],project,
                      bundle_root=fixture.root,lookup=fixture.lookup)
                  phrase2=_replace_phrase('demo',bundle2['plan_id'],plan2['state_binding_id'])
                  second=replace_existing(bundle2['plan_id'],project,plan2['state_binding_id'],
                      bundle_root=fixture.root,lookup=fixture.lookup,reader=lambda _:phrase2)
                  assert second['status']=='codex_project_skill_replaced'
                  assert expected.read_bytes()==v2
                  assert len(discover())==1
                  # Phase 42: Restore a committed previous pinned version;
                  # retain the current version and the original backup.
                  restore_plan=preview_restore('demo',project,second['backup_id'])
                  assert restore_plan['restored_source_kind']=='pinned'
                  restore_phrase=_restore_phrase(
                      'demo',second['backup_id'],restore_plan['current_plan_id'],
                      restore_plan['state_binding_id'])
                  first_restore=restore_backup(
                      'demo',project,second['backup_id'],restore_plan['state_binding_id'],
                      reader=lambda _:restore_phrase)
                  assert first_restore['status']=='codex_project_skill_backup_restored'
                  assert expected.read_bytes()==v1
                  assert len(discover())==1
                  v2_saved_id=first_restore['saved_current_backup_id']
                  assert (_backup_dir(project/'.gasl-managed','demo',v2_saved_id)/
                          'SKILL.md').read_bytes()==v2

                  # Inject failure after restoring v2's directory but before
                  # committing the new receipt; recovery must return v1.
                  back_plan=preview_restore('demo',project,v2_saved_id)
                  back_phrase=_restore_phrase(
                      'demo',v2_saved_id,back_plan['current_plan_id'],
                      back_plan['state_binding_id'])
                  with patch.object(installer,'_atomic_record',
                                    side_effect=OSError('injected restore commit failure')):
                      try:
                          restore_backup('demo',project,v2_saved_id,
                              back_plan['state_binding_id'],reader=lambda _:back_phrase)
                      except OSError as error:
                          assert 'injected restore commit failure' in str(error)
                      else:
                          raise AssertionError('Restore failure injection did not fire')
                  assert expected.read_bytes()==v2
                  repaired=recover('demo',project)
                  assert repaired['status']=='interrupted_restore_rolled_back',repaired
                  assert expected.read_bytes()==v1
                  assert len(discover())==1
                  back_plan=preview_restore('demo',project,v2_saved_id)
                  back_phrase=_restore_phrase(
                      'demo',v2_saved_id,back_plan['current_plan_id'],
                      back_plan['state_binding_id'])
                  reverted=restore_backup(
                      'demo',project,v2_saved_id,back_plan['state_binding_id'],
                      reader=lambda _:back_phrase)
                  assert reverted['status']=='codex_project_skill_backup_restored'
                  assert expected.read_bytes()==v2
                  assert len(discover())==1
                  result=uninstall('demo',project,
                      reader=lambda _:_remove_phrase('demo',bundle2['plan_id']))
                  assert result['status']=='codex_project_skill_uninstalled'
                  assert result['uninstall_ownership_marker_recorded']
                  assert not discover(), 'Removed Skill must be absent'
                  assert not expected.exists()
                  selected=result['archived_last_active_backup_id']
                  listing=list_uninstalled_backups('demo',project)
                  assert listing['backup_count']==len(result['retained_backup_ids'])
                  assert listing['backups'][-1]['last_active_before_uninstall']

                  # Phase 43: intentionally interrupt a reinstatement after
                  # the target activation and verify journaled rollback.
                  new_plan=preview_reinstall('demo',project,selected)
                  marker=archived_tools._read_marker(project,'demo',project/'.gasl-managed')
                  phrase=_reinstall_phrase(
                      'demo',selected,marker['uninstall_event_id'],new_plan['state_binding_id'])
                  old_new=archived_tools._new
                  def fail_reinstall_receipt(path,data):
                      if path.resolve()==(project/'.gasl-managed/receipts/demo.json').resolve():
                          raise OSError('injected reinstall receipt crash')
                      return old_new(path,data)
                  with patch.object(archived_tools,'_new',side_effect=fail_reinstall_receipt):
                      try:
                          reinstall_backup('demo',project,selected,new_plan['state_binding_id'],
                                           reader=lambda _:phrase)
                      except OSError as error:
                          assert 'injected reinstall receipt crash' in str(error)
                      else:
                          raise AssertionError('Injected reinstall failure did not fire')
                  assert expected.read_bytes()==v2
                  rolled=recover('demo',project)
                  assert rolled['status']=='interrupted_reinstall_rolled_back',rolled
                  assert not discover(), 'Interrupted reinstall was not removed'

                  new_plan=preview_reinstall('demo',project,selected)
                  phrase=_reinstall_phrase(
                      'demo',selected,marker['uninstall_event_id'],new_plan['state_binding_id'])
                  installed=reinstall_backup(
                      'demo',project,selected,new_plan['state_binding_id'],reader=lambda _:phrase)
                  assert installed['status']=='codex_uninstalled_skill_reinstalled_from_backup'
                  assert expected.read_bytes()==v2
                  assert len(discover())==1, 'Codex must rediscover reinstated Skill'
                  # Second removal must retain both prior and new ownership.
                  removed_again=uninstall('demo',project,
                      reader=lambda _:_remove_phrase('demo',bundle2['plan_id']))
                  assert removed_again['status']=='codex_project_skill_uninstalled'
                  assert len(removed_again['retained_backup_ids']) == listing['backup_count']+1
                  assert not discover()
                  assert not expected.exists()

                  # Phase 44: simulate a pre-Phase-43 orphan by explicitly
                  # removing the new ownership marker and newest current
                  # archive *inside this disposable test-only project*.
                  orphan_id=removed_again['archived_last_active_backup_id']
                  archived_path=_backup_dir(project/'.gasl-managed','demo',orphan_id)
                  _remove_verified_dir(archived_path,_inventory(archived_path))
                  _backup_manifest(project/'.gasl-managed','demo',orphan_id).unlink()
                  (project/'.gasl-managed/uninstalled/demo.json').unlink()
                  reviewed=audit_legacy_backups('demo',project)
                  assert reviewed['backup_count'] == listing['backup_count']
                  assert reviewed['historical_project_ownership_verified'] is False
                  selected_legacy=reviewed['backups'][-1]['backup_id']
                  preflight=preview_legacy_reinstall('demo',project,selected_legacy)
                  assert preflight['manual_ownership_attestation_required'] is True
                  human_test_phrase=legacy_reinstall_phrase(
                      'demo',selected_legacy,preflight['state_binding_id'])
                  reconciled=reinstall_legacy_backup(
                      'demo',project,selected_legacy,preflight['state_binding_id'],
                      reader=lambda _:human_test_phrase)
                  assert reconciled['status']=='legacy_skill_reinstalled_with_manual_ownership_attestation'
                  assert reconciled['historical_project_ownership_verified'] is False
                  assert len(discover())==1, 'Codex must discover manually reconciled inert Skill'
                  active=json.loads((project/'.gasl-managed/receipts/demo.json').read_text())
                  assert active['action']=='legacy_reconcile_install'
                  assert active['source_kind']=='unmanaged'
                  assert active['historical_project_ownership_verified'] is False
                  final_uninstall=uninstall('demo',project,
                      reader=lambda _:_remove_phrase('demo',active['plan_id']))
                  assert final_uninstall['uninstall_ownership_marker_recorded']
                  assert not discover()
              print('CODEX_REAL_PROJECT_LEGACY_ATTESTED_RECOVERY_DISCOVERY=PASS')
              print('REAL_USER_PROFILE_MODIFIED=FALSE; THIRD_PARTY_EXECUTED=FALSE')
          finally:
              fixture.doCleanups()
          PY

      - name: Run actual Codex app-server before install, after install, after rollback
        run: |
          set -euo pipefail
          python3 tools/codex_transaction_e2e.py \
            --codex-bin "$GASL_CODEX_E2E_CLI" \
            --output "$RUNNER_TEMP/gasl-codex-transaction-e2e.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'gasl-codex-transaction-e2e.json').read_text())
          assert report['status']=='real_codex_inert_install_discovery_rollback_verified'
          for key in ('absent_before_install','inert_skill_discovered_after_install',
                      'absent_after_rollback','fixture_rollback_verified'):
              assert report[key] is True,key
          for key in ('model_turn_started','authentication_performed',
                      'third_party_skill_installed_or_executed','real_host_files_modified',
                      'production_installation_enabled'):
              assert report[key] is False,key
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as output:
              output.write('## Codex real Host Skill lifecycle — PASS\n\n')
              output.write('Real Codex CLI `0.162.1` observed an inert Skill absent → discovered after fixture-only installation → absent after verified rollback.\n\n')
              output.write('No account, model turn, downloaded third-party Skill or real Agent profile was accessed.\n')
          print('REAL_CODEX_INERT_INSTALL_DISCOVER_ROLLBACK=PASS')
          PY

      - name: Run real Codex through a one-time receipt and assert no human consent claim
        run: |
          set -euo pipefail
          python3 tools/codex_transaction_e2e.py \
            --codex-bin "$GASL_CODEX_E2E_CLI" \
            --test-one-time-receipt \
            --output "$RUNNER_TEMP/gasl-codex-one-time-consent-e2e.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'gasl-codex-one-time-consent-e2e.json').read_text())
          assert result['status']=='real_codex_inert_install_discovery_rollback_verified'
          for name in ('absent_before_install','inert_skill_discovered_after_install',
                       'absent_after_rollback','fixture_rollback_verified',
                       'one_time_fixture_receipt_consumed'):
              assert result[name] is True,name
          for name in ('human_confirmation_verified','model_turn_started',
                       'authentication_performed','third_party_skill_installed_or_executed',
                       'real_host_files_modified','production_installation_enabled'):
              assert result[name] is False,name
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as output:
              output.write('\n## One-time consent receipt rehearsal — PASS\n\n')
              output.write('The receipt was programmatically confirmed in an isolated test fixture; **this is not actual human consent**.\n\n')
              output.write('Real Codex verified absent → discovered → absent, and a one-time receipt was consumed under the exclusive lock.\n')
          print('REAL_CODEX_ONE_TIME_FIXTURE_RECEIPT=PASS; HUMAN_APPROVAL=NOT_TESTED')
          PY

      - name: Verify real Codex user-scope Skill discovery inside a separate HOME profile
        run: |
          set -euo pipefail
          python3 tools/codex_transaction_e2e.py \
            --codex-bin "$GASL_CODEX_E2E_CLI" \
            --scope user \
            --test-one-time-receipt \
            --output "$RUNNER_TEMP/gasl-codex-user-scope-e2e.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'gasl-codex-user-scope-e2e.json').read_text())
          assert result['status']=='real_codex_inert_install_discovery_rollback_verified'
          assert result['scope']=='user'
          assert result['isolated_home_profile_used'] is True
          assert result['real_home_or_codex_profile_accessed'] is False
          for key in ('absent_before_install','inert_skill_discovered_after_install',
                      'absent_after_rollback','fixture_rollback_verified',
                      'one_time_fixture_receipt_consumed'):
              assert result[key] is True,key
          for key in ('human_confirmation_verified','model_turn_started',
                      'authentication_performed','third_party_skill_installed_or_executed',
                      'real_host_files_modified','production_installation_enabled'):
              assert result[key] is False,key
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as output:
              output.write('\n## Codex user-scope isolated HOME lifecycle — PASS\n\n')
              output.write('Actual Codex CLI `0.162.1` discovered an inert test Skill under a disposable `$HOME/.agents/skills`, then confirmed its removal after rollback. A one-time receipt was consumed. No actual user home was accessed.\n')
              output.write('CI simulated the confirmation phrase; this is not a real human consent event.\n')
          print('REAL_CODEX_USER_SCOPE_ISOLATED_HOME=PASS; HUMAN_APPROVAL=NOT_TESTED')
          PY

      - name: Assert no persistent private Skill contents were exported
        run: |
          set -euo pipefail
          test ! -e private/install-bundles
          test ! -e catalog
          test ! -e private/install-simulation
          echo 'THIRD_PARTY_SKILL_CONTENT_EXPORTED=FALSE'
          echo 'REAL_USER_PROFILE_MODIFIED=FALSE'
