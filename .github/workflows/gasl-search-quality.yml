name: GASL — Provisional search quality regression

on:
  push:
    branches:
      - main
    paths:
      - tools/benchmark_reconcile.py
      - tools/search_ranking_lab.py
      - tools/search_benchmark.py
      - tools/skill_search.py
      - benchmarks/search-gold-v1.json
      - benchmarks/search-gold-v1-crosswalk.json
      - registry/source-catalog.json
      - tests/test_benchmark_reconcile.py
      - tests/test_search_ranking_lab.py
      - .github/workflows/gasl-search-quality.yml
  pull_request:
    paths:
      - tools/benchmark_reconcile.py
      - tools/search_ranking_lab.py
      - tools/search_benchmark.py
      - tools/skill_search.py
      - benchmarks/search-gold-v1.json
      - benchmarks/search-gold-v1-crosswalk.json
      - registry/source-catalog.json
      - tests/test_benchmark_reconcile.py
      - tests/test_search_ranking_lab.py
      - .github/workflows/gasl-search-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provisional-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run immutable crosswalk and benchmark regression tests
        run: |
          python3 -m compileall -q tools tests
          python3 -m unittest tests.test_benchmark_reconcile tests.test_search_ranking_lab tests.test_search_benchmark -q

      - name: Audit all pinned judgment identities before evaluating ranking
        id: drift
        run: |
          python3 tools/benchmark_reconcile.py \
            --map benchmarks/search-gold-v1-crosswalk.json \
            --audit-report "$RUNNER_TEMP/gasl-benchmark-drift.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          audit=json.loads((Path(os.environ['RUNNER_TEMP'])/'gasl-benchmark-drift.json').read_text(encoding='utf-8'))
          status=audit['evaluation_status']
          ready=audit['ranking_metrics_allowed']
          assert status in ('ready_provisional', 'rejudgment_required')
          assert ready == (status == 'ready_provisional') == (audit['blocked_judgment_count'] == 0)
          assert audit['same_blob_eligible_judgment_count'] + audit['blocked_judgment_count'] == audit['total_judgments']
          assert audit['new_judgments_created'] is False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('ready='+str(ready).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Provisional judgment identity audit\n\n')
              f.write('**Evaluation status:** '+status+'\n\n')
              f.write('Same-blob eligible judgments: '+str(audit['same_blob_eligible_judgment_count'])+' / '+str(audit['total_judgments'])+'\n\n')
              f.write('Blocked judgments: '+str(audit['blocked_judgment_count'])+'; affected queries: '+str(audit['affected_query_count'])+'\n\n')
              if not ready:
                  f.write('**Ranking metrics and ablations NOT RUN. Rejudgment required; no old grades transferred to changed content.**\n')
          if not ready:
              print('::warning::Benchmark version drift detected; ranking evaluation remains blocked pending rejudgment.')
          PYTHON

      - name: Reconcile Git-blob-pinned provisional labels, never human gold
        if: steps.drift.outputs.ready == 'true'
        run: |
          python3 tools/benchmark_reconcile.py \
            --map benchmarks/search-gold-v1-crosswalk.json \
            --report /tmp/gasl-provisional-reconciled-baseline.json

      - name: Compare candidate ranking orders without changing production ranking
        if: steps.drift.outputs.ready == 'true'
        run: |
          python3 tools/search_ranking_lab.py \
            --output /tmp/gasl-provisional-rank-ablation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path('/tmp/gasl-provisional-reconciled-baseline.json').read_text())
          experiment=json.loads(Path('/tmp/gasl-provisional-rank-ablation.json').read_text())
          assert experiment['query_count'] == baseline['query_count'] == 26
          assert experiment['judgment_count'] == baseline['judgment_count'] == 148
          assert experiment['metrics']['production'] == baseline['averages']
          assert experiment['production_ranker_changed'] is False
          assert experiment['ranker_winner_selected'] is False
          assert experiment['independent_human_gold_available'] is False
          assert experiment['no_answer_gold_available'] is False
          assert baseline['reconciliation']['remapped_source_id_count'] >= 0
          print('PROVISIONAL_SEARCH_EVALUATION_GATES=PASS')
          PY

      - name: Confirm working tree remains unchanged
        run: |
          git diff --exit-code
          git diff --check
