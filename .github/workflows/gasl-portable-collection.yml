name: GASL — Portable selected Skill collection
on:
  push:
    branches: [main]
    paths:
      - tools/queue_ingest.py
      - tools/on_demand.py
      - tools/security_gate.py
      - tools/static_scan.py
      - tools/transaction_file_lock.py
      - tools/canonical_lineage.py
      - tools/canonical_package.py
      - tools/root_skill_review.py
      - tests/test_canonical_package.py
      - tests/test_root_skill_review.py
      - tests/test_queue_ingest*.py
      - tests/test_on_demand.py
      - tests/test_security_gate.py
      - tests/test_install_lifecycle.py
      - .github/workflows/gasl-portable-collection.yml
  pull_request:
    paths:
      - tools/queue_ingest.py
      - tools/on_demand.py
      - tools/security_gate.py
      - tools/static_scan.py
      - tools/transaction_file_lock.py
      - tools/canonical_lineage.py
      - tools/canonical_package.py
      - tools/root_skill_review.py
      - tests/test_canonical_package.py
      - tests/test_root_skill_review.py
      - tests/test_queue_ingest*.py
      - tests/test_on_demand.py
      - tests/test_security_gate.py
      - tests/test_install_lifecycle.py
      - .github/workflows/gasl-portable-collection.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collection:
    name: Collection / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise inert collection, transport guards and audit
        run: python -m unittest tests.test_queue_ingest tests.test_queue_ingest_lock tests.test_on_demand tests.test_root_skill_review tests.test_canonical_package tests.test_security_gate tests.test_install_lifecycle -v
      - name: Verify tracked files unchanged
        run: git diff --exit-code
