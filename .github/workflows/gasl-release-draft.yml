name: GASL — Private MVP release draft gate

on:
  push:
    branches: [main]
    paths:
      - tools/release_draft.py
      - tools/gasl.py
      - tests/test_release_draft.py
      - tests/release_package_smoke.py
      - .github/workflows/gasl-release-draft.yml
  pull_request:
    paths:
      - tools/release_draft.py
      - tools/gasl.py
      - tests/test_release_draft.py
      - tests/release_package_smoke.py
      - .github/workflows/gasl-release-draft.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-release-draft:
    name: Private draft reproducibility / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test tracked-only packaging and publication blockers
        run: |
          python -m compileall -q tools tests
          python -m unittest tests.test_release_draft -v

      - name: Audit real source tree without building or publishing
        run: >-
          python -c "import sys; sys.path.insert(0, 'tools'); from release_draft import inspect_release;
          r=inspect_release(); assert r['private_artifact_only'] is True;
          assert r['public_release_allowed'] is False; assert r['all_files_from_git_index'] is True;
          assert r['content_bound_to_commit_tree'] is True; assert r['third_party_skill_executed'] is False;
          assert r['host_paths_modified'] is False; print('PRIVATE_RELEASE_PUBLICATION_GATE=PASS')"

      - name: Build and smoke-test the standalone private package (runner only)
        run: |
          python -m pip install -r requirements-mcp.txt
          python tools/gasl.py release-draft --action build
          python tests/release_package_smoke.py --mcp

      - name: Remove only the runner-generated private draft
        if: always()
        run: >-
          python -c "from pathlib import Path; import subprocess;
          c=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()[:12];
          p=Path('private/release-drafts')/('gasl-mvp-'+c+'.zip');
          p.unlink(missing_ok=True); p.with_suffix('.zip.json').unlink(missing_ok=True);
          p.parent.rmdir() if p.parent.exists() else None"

      - name: Ensure CI did not retain release artifacts
        run: |
          python -c "from pathlib import Path; assert not Path('private/release-drafts').exists()"
          git diff --exit-code
          git diff --check
