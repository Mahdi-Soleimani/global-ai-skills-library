name: GASL — Daily source catalog refresh

on:
  schedule:
    # Daily refresh; avoid the top of the hour when scheduled runners are busiest.
    - cron: "23 7 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/gasl-refresh.yml
      - tools/**
      # Sandbox canary CI is self-contained; do not refresh 4,000+ Skill
      # metadata records for a test-harness-only change.
      - '!tools/sandbox_canary/**'
      - '!tools/sandbox_canary_runner.py'
      - '!tools/sandbox_gate.py'
      - config/discovery-targets.json
      - config/policy.json
      - config/taxonomy.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gasl-library-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt -r requirements-mcp.txt

      - name: Run regression tests
        run: python3 -m pytest -q

      - name: Refresh all commit-pinned source repositories
        id: discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/discover.py --limit 100 --refresh --retry-errors

      # This runner maintains references, not a temporary or durable Skill archive.
      # The user's local GASL retrieves selected packages directly from upstream.
      - name: Refresh public source catalog (all license classes)
        run: python3 tools/build_source_catalog.py --public-only

      - name: Incrementally extract verified public search vocabulary
        run: python3 tools/search_features.py --limit 200 --workers 4

      - name: Build evidence-only assessments
        run: python3 tools/skill_evaluation.py

      - name: Build and smoke-test local search and routing indexes
        run: |
          python3 tools/skill_search.py --check
          python3 tools/gasl.py search --query "security audit" --limit 3 --json > /tmp/gasl-search-smoke.json
          python3 tools/gasl.py route --task "security audit" --top-k 3 --json > /tmp/gasl-route-smoke.json
          python3 - <<'PY'
          import json
          with open("/tmp/gasl-search-smoke.json", encoding="utf-8") as stream:
              search = json.load(stream)
          with open("/tmp/gasl-route-smoke.json", encoding="utf-8") as stream:
              route = json.load(stream)
          assert search["count"] > 0
          assert route["returned_count"] > 0
          assert route["execution_performed"] is False
          assert route["installation_performed"] is False
          print("Search and route smoke tests passed.")
          PY

      - name: Validate generated changes
        run: git diff --check

      - name: Commit updated source metadata only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/download-queue.json
          git add registry/discovery-state.json
          git add registry/source-catalog.json
          git add registry/source-catalog.csv
          git add registry/source-catalog-summary.json
          git add registry/search-features.json
          git add registry/skill-evaluations.json
          git add reconciliation/discovery-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh attributed skill catalog"
            if git push origin HEAD:main; then
              echo "Refreshed source metadata committed and published."
            else
              # A developer may push while this scheduled refresh is running.
              # Never force-push, overwrite their work, or merge stale metadata
              # generated against an older source snapshot into a newer main.
              git fetch origin main
              if git merge-base --is-ancestor HEAD origin/main; then
                echo "Refreshed metadata was already published to the remote."
              elif git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
                echo "::warning::main advanced while refreshing; metadata publish safely skipped."
                echo "Source metadata was generated but NOT published because main advanced concurrently; the next refresh must regenerate it." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::Remote main was rewritten or moved unexpectedly; refusing metadata push."
                exit 1
              fi
            fi
          else
            echo "No source or package changes to commit."
          fi
