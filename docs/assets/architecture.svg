<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
<title id="title">GASL architecture</title><desc id="desc">Pinned upstream repositories feed a metadata catalog and local FTS search and routing engine, exposed through CLI, MCP and Explorer. Explicit retrieval and verification are separate from installation.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d9fb8"/></marker></defs>
<rect width="1120" height="410" rx="20" fill="#101b2b"/>
<g font-family="system-ui, sans-serif" fill="#e6f1fa"><text x="40" y="45" font-size="23" font-weight="700">Local-first architecture</text><text x="40" y="70" fill="#a1b4c8" font-size="14">Discovery and retrieval are separate from installation and execution.</text></g>
<g stroke="#324b65" stroke-width="1.5" fill="#17293d"><rect x="40" y="103" width="230" height="115" rx="12"/><rect x="305" y="103" width="230" height="115" rx="12"/><rect x="570" y="103" width="230" height="115" rx="12"/><rect x="835" y="103" width="245" height="115" rx="12"/><rect x="305" y="267" width="495" height="104" rx="12" stroke="#427e82"/></g>
<g stroke="#7d9fb8" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M270 160H299"/><path d="M535 160H564"/><path d="M800 160H829"/><path d="M420 218V261"/><path d="M685 218V261"/></g>
<g font-family="system-ui, sans-serif" fill="#edf6ff" font-size="17" font-weight="650"><text x="60" y="140">Upstream sources</text><text x="325" y="140">Source catalog</text><text x="590" y="140">Search + routing</text><text x="855" y="140">User interfaces</text><text x="325" y="303" fill="#a8f1df">Explicit retrieval and verification</text></g>
<g font-family="system-ui, sans-serif" fill="#b0c3d6" font-size="14"><text x="60" y="168">Repository / commit</text><text x="60" y="190">Git tree + blob SHA</text><text x="325" y="168">Attribution / license</text><text x="325" y="190">Local SQLite metadata</text><text x="590" y="168">FTS5 / taxonomy</text><text x="590" y="190">Optional offline E5</text><text x="855" y="168">CLI / MCP STDIO</text><text x="855" y="190">REST / Explorer</text><text x="325" y="331">Pinned files • integrity • static evidence</text><text x="325" y="352">Separate consent-bound installation controls</text></g>
